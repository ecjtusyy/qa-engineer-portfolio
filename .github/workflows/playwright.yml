name: SauceDemo Playwright

on:
  push:
    branches: [main]
    paths:
      - '06-playwright-tests/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [main]
    paths:
      - '06-playwright-tests/**'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:

jobs:
  saucedemo-regression:
    name: SauceDemo regression (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: 06-playwright-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 06-playwright-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type-check Playwright project
        run: npm run typecheck

      - name: Run SauceDemo regression
        run: npm run test:regression -- --reporter=list,html

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-playwright-report
          path: 06-playwright-tests/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-playwright-traces
          path: 06-playwright-tests/test-results
          if-no-files-found: ignore
          retention-days: 7
